<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Floor plan rectangle -->
  <rect x="60" y="45" width="280" height="160" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.7)" stroke-width="2.5"/>
  <!-- Grid lines vertical -->
  <line x1="130" y1="45" x2="130" y2="205" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="200" y1="45" x2="200" y2="205" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="270" y1="45" x2="270" y2="205" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Grid lines horizontal -->
  <line x1="60" y1="99" x2="340" y2="99" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="60" y1="152" x2="340" y2="152" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Room dividers -->
  <line x1="200" y1="99" x2="200" y2="205" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <line x1="60" y1="152" x2="200" y2="152" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- Dimension arrows – top -->
  <line x1="60" y1="30" x2="340" y2="30" stroke="white" stroke-width="1.5"/>
  <polygon points="60,25 50,30 60,35" fill="white"/>
  <polygon points="340,25 350,30 340,35" fill="white"/>
  <text x="200" y="26" text-anchor="middle" fill="white" font-size="11" font-family="Arial">12.50 m</text>
  <!-- Dimension arrows – right -->
  <line x1="356" y1="45" x2="356" y2="205" stroke="white" stroke-width="1.5"/>
  <polygon points="351,45 356,35 361,45" fill="white"/>
  <polygon points="351,205 356,215 361,205" fill="white"/>
  <text x="378" y="130" text-anchor="middle" fill="white" font-size="11" font-family="Arial" transform="rotate(90,378,130)">8.00 m</text>
  <!-- SQM label in center -->
  <text x="130" y="155" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="16" font-family="Arial" font-weight="bold">100 m²</text>
  <text x="270" y="185" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="11" font-family="Arial">56 m²</text>
  <text x="130" y="185" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="11" font-family="Arial">44 m²</text>
  <text x="200" y="235" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-size="12" font-family="Arial" letter-spacing="2">SQM MANAGEMENT</text>
</svg>
