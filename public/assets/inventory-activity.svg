<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Warehouse shelf structure -->
  <rect x="30" y="60" width="180" height="8" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="30" y="120" width="180" height="8" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="30" y="180" width="180" height="8" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="30" y="60" width="8" height="128" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="202" y="60" width="8" height="128" rx="2" fill="rgba(255,255,255,0.4)"/>
  <!-- Boxes on shelves -->
  <rect x="42" y="72" width="28" height="40" rx="3" fill="rgba(255,255,255,0.55)"/>
  <rect x="76" y="78" width="28" height="34" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="110" y="68" width="28" height="44" rx="3" fill="rgba(255,255,255,0.55)"/>
  <rect x="144" y="75" width="28" height="37" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="42" y="132" width="28" height="40" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="76" y="136" width="28" height="36" rx="3" fill="rgba(255,255,255,0.55)"/>
  <rect x="110" y="130" width="28" height="42" rx="3" fill="rgba(255,255,255,0.4)"/>
  <!-- Activity chart on the right -->
  <rect x="240" y="50" width="135" height="150" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Chart bars -->
  <rect x="258" y="140" width="18" height="48" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="284" y="120" width="18" height="68" rx="3" fill="rgba(255,255,255,0.65)"/>
  <rect x="310" y="100" width="18" height="88" rx="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="336" y="78" width="18" height="110" rx="3" fill="rgba(255,255,255,0.8)"/>
  <!-- Chart axis -->
  <line x1="252" y1="192" x2="362" y2="192" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <line x1="252" y1="60" x2="252" y2="192" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <!-- Upward trend arrow -->
  <polyline points="258,175 284,155 310,128 336,100" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="230" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-size="12" font-family="Arial" letter-spacing="2">INVENTORY ACTIVITY</text>
</svg>
