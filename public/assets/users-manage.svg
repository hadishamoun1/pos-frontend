  <line x1="240" y1="108" x2="244" y2="108" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="216" y1="96" x2="219" y2="99" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="237" y1="117" x2="240" y2="120" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>
