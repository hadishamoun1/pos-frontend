<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Bar chart (left) -->
  <rect x="35" y="50" width="150" height="155" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <rect x="52" y="145" width="22" height="50" rx="3" fill="rgba(255,255,255,0.45)"/>
  <rect x="82" y="118" width="22" height="77" rx="3" fill="rgba(255,255,255,0.6)"/>
  <rect x="112" y="96" width="22" height="99" rx="3" fill="rgba(255,255,255,0.45)"/>
  <rect x="142" y="72" width="22" height="123" rx="3" fill="rgba(255,255,255,0.75)"/>
  <line x1="45" y1="198" x2="175" y2="198" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
