  <path d="M290,128 L347,163 A66,66 0 0,1 233,163 Z" fill="rgba(255,255,255,0.4)"/>
  <path d="M290,128 L233,163 A66,66 0 0,1 290,62 Z" fill="rgba(255,255,255,0.25)"/>
  <!-- Center circle of pie -->
  <circle cx="290" cy="128" r="28" fill="rgba(255,255,255,0.12)"/>
  <text x="290" y="134" text-anchor="middle" fill="white" font-size="13" font-family="Arial" font-weight="bold">%</text>
  <text x="200" y="230" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-size="12" font-family="Arial" letter-spacing="2">REPORTS</text>
