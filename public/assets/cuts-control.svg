<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Glass/material sheet -->
  <rect x="50" y="55" width="220" height="145" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <!-- Shine effect on glass -->
  <rect x="60" y="65" width="8" height="125" rx="3" fill="rgba(255,255,255,0.25)"/>
  <!-- Cut lines on sheet -->
  <line x1="50" y1="127" x2="270" y2="127" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="160" y1="55" x2="160" y2="200" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Measurements on cuts -->
  <text x="105" y="120" text-anchor="middle" fill="white" font-size="11" font-family="Arial">60cm</text>
  <text x="215" y="120" text-anchor="middle" fill="white" font-size="11" font-family="Arial">60cm</text>
  <!-- Scissors icon (right side) -->
  <g transform="translate(305,95) rotate(-35)">
    <!-- Blade 1 -->
    <ellipse cx="0" cy="-28" rx="7" ry="28" fill="rgba(255,255,255,0.85)" rx="3"/>
    <!-- Blade 2 -->
    <ellipse cx="0" cy="28" rx="7" ry="28" fill="rgba(255,255,255,0.65)" rx="3"/>
    <!-- Screw center -->
    <circle cx="0" cy="0" r="7" fill="rgba(255,255,255,0.9)"/>
    <circle cx="0" cy="0" r="3" fill="#dc2626"/>
    <!-- Handles -->
    <ellipse cx="-12" cy="-52" rx="10" ry="12" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="3"/>
    <ellipse cx="12" cy="52" rx="10" ry="12" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="3"/>
  </g>
  <!-- Dimension marks -->
  <line x1="50" y1="210" x2="270" y2="210" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <polygon points="50,205 40,210 50,215" fill="rgba(255,255,255,0.5)"/>
  <polygon points="270,205 280,210 270,215" fill="rgba(255,255,255,0.5)"/>
  <text x="160" y="227" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11" font-family="Arial">120 cm</text>
  <text x="200" y="245" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11" font-family="Arial" letter-spacing="2">CUTS CONTROL</text>
</svg>
