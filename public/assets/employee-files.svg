<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Back folder -->
  <rect x="200" y="65" width="155" height="120" rx="8" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <rect x="200" y="55" width="70" height="18" rx="4" fill="rgba(255,255,255,0.25)"/>
  <!-- Middle folder -->
  <rect x="115" y="72" width="155" height="120" rx="8" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <rect x="115" y="62" width="70" height="18" rx="4" fill="rgba(255,255,255,0.3)"/>
  <!-- Front folder -->
  <rect x="35" y="80" width="155" height="125" rx="8" fill="rgba(255,255,255,0.28)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <rect x="35" y="68" width="70" height="20" rx="4" fill="rgba(255,255,255,0.45)"/>
  <!-- Person avatar inside front folder -->
  <circle cx="113" cy="122" r="24" fill="rgba(255,255,255,0.5)"/>
  <circle cx="113" cy="114" r="13" fill="rgba(255,255,255,0.85)"/>
  <path d="M80,165 Q80,142 113,142 Q146,142 146,165 Z" fill="rgba(255,255,255,0.7)"/>
  <!-- ID lines on front folder -->
  <rect x="55" y="170" width="90" height="7" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="55" y="183" width="65" height="7" rx="3" fill="rgba(255,255,255,0.3)"/>
  <text x="200" y="235" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-size="12" font-family="Arial" letter-spacing="2">EMPLOYEE FILES</text>
